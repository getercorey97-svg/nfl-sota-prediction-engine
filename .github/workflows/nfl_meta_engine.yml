name: NFL SOTA Meta-Engine
on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours, every day
  workflow_dispatch:      # Allows you to click "Run Workflow" manually

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run SOTA Cycle
        run: python pipeline.py

      - name: Commit Intelligence Update
        run: |
          git config --global user.name 'SOTA-Bot'
          git config --global user.email 'bot@nfl-ai.com'
          git add engine_metadata.json
          git commit -m "Engine Self-Update: $(date)" || echo "No changes"
          git push
