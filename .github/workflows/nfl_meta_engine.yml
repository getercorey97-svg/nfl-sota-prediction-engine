name: NFL SOTA Live Engine
on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

jobs:
  run-live-scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up future runs
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Engine
        run: python pipeline.py
      - name: Commit Intelligence
        run: |
          git config --global user.name 'SOTA-Live-Bot'
          git config --global user.email 'bot@nfl-sota.com'
          git add engine_metadata.json
          git commit -m "Live Update: Roster/Injury Check [$(date)]" || echo "No changes"
          git push
