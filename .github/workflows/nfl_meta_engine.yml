name: NFL SOTA Live Engine
on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes for live roster monitoring
  workflow_dispatch:

jobs:
  run-live-scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install nfl_data_py pandas numpy
      - name: Run Engine
        run: python pipeline.py
      - name: Commit Learned Team Weights
        run: |
          git config --global user.name 'SOTA-Live-Bot'
          git config --global user.email 'bot@nfl-sota.com'
          git add engine_metadata.json
          git commit -m "Auto-Update: Game Day Roster & Team Intelligence [$(date)]" || echo "No changes"
          git push
