name: 🤖 AI System Architect (Self-Correction)

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * 1' 

permissions:
  contents: write 

jobs:
  total-system-repair:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.PAT_WORKFLOW }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Repair Dependencies
        run: |
          pip install requests openai polars numpy scipy

      - name: 🛠️ Run Universal AI Fixer
        run: python ai_universal_fixer.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: 🚀 Commit & Push Healed Code
        run: |
          git config --global user.name 'AI-System-Architect'
          git config --global user.email 'architect-bot@nfl.ai'
          
          # Dynamically add all modified/fixed files across the whole repo
          git add -A
          
          # Check for changes and commit
          if git diff --staged --quiet; then
            echo "No changes detected by AI Architect. System is optimal."
          else
            git commit -m "AI SELF-HEALING: Universal System Audit & Code Repair [$(date)]"
            git push origin main
          fi
